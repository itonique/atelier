ol.events{list-style:none;margin:0;padding:6px 18px;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}

footer{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:.9rem}

  <div id="out" style="display:flex;flex-direction:column;gap:32px"></div>

</div>

function regime(y){
 if(y<=1947) return "Regatul României";
 if(y<=1964) return "Republica Populară Română";
 if(y<=1989) return "Republica Socialistă România";
 return "România";
}
function leader(y){
 if(y===1940) return ["Carol al II-lea, apoi Mihai I și Ion Antonescu","rege și conducătorul statului"];
 if(y<=1943) return ["Ion Antonescu","conducătorul statului, sub regele Mihai I"];
 if(y===1944) return ["Regele Mihai I","după 23 august"];
 if(y<=1947) return ["Regele Mihai I","cu guvernul Petru Groza"];
 if(y<=1964) return ["Gheorghe Gheorghiu-Dej","liderul Partidului Muncitoresc Român"];
 if(y===1965) return ["Nicolae Ceaușescu","de la 22 martie"];
 if(y<=1989) return ["Nicolae Ceaușescu", y>=1974?"președintele țării":"liderul partidului"];
 if(y<=1996) return ["Ion Iliescu","președinte"];
 if(y<=2000) return ["Emil Constantinescu","președinte"];
 if(y<=2004) return ["Ion Iliescu","președinte"];
 return ["Traian Băsescu","președinte"];
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
for(let y=2005;y>=1940;y--){const o=document.createElement("option");o.value=y;o.textContent=y;$("year").appendChild(o)}
for(let d=1;d<=31;d++){const o=document.createElement("option");o.value=d;o.textContent=d;$("day").appendChild(o)}
MONTHS.forEach((m,i)=>{const o=document.createElement("option");o.value=i+1;o.textContent=m;$("month").appendChild(o)});

function dayStory(d,m){
 if(!d||!m) return null;
 const exact=DAYS.filter(x=>x[0]===d&&x[1]===m);
 if(exact.length) return {exact:true,items:exact};
 const doy=(dd,mm)=>new Date(2001,mm-1,dd).getTime()/864e5;
 const t=doy(d,m);let best=null,bd=1e9;
 for(const x of DAYS){let diff=Math.abs(doy(x[0],x[1])-t);diff=Math.min(diff,365-diff);if(diff<bd){bd=diff;best=x}}
 return {exact:false,items:[best],gap:Math.round(bd)};
}

function render(){
 const y=+$("year").value,d=+$("day").value||0,m=+$("month").value||0,name=$("name").value.trim();
 const ev=EV[y]||[];const [ld,lr]=leader(y);const since=y-1918;
 const ds=dayStory(d,m);const ys=YEAR_STORY[y];
 const dateTxt=d&&m?`${d} ${MONTHS[m-1]} ${y}`:String(y);
 let h=`<div class="hero"><span class="kicker">${name?esc(name)+", te-ai născut în":"Te-ai născut în"}</span><div class="big">${y}</div>
 <p class="lead">${d&&m?`Pe ${d} ${MONTHS[m-1]}. `:""}Iată cum arăta țara în anul tău.</p></div>`;
 h+=`<section><h2>Țara, atunci</h2><div class="facts">
 <div class="fact"><span class="meta">Țara se numea</span><b>${regime(y)}</b></div>
 <div class="fact"><span class="meta">La conducere</span><b>${ld}</b><span class="meta">${lr}</span></div>
 <div class="fact"><span class="meta">De la Marea Unire</span><b>${since} de ani</b><span class="meta">din 1918</span></div></div></section>`;
 h+=`<section><h2>Ce se întâmpla în ${y}</h2>${ev.length?`<ol class="events">${ev.map(e=>`<li><span class="tag ${e[0]==="L"?"world":""}">${e[0]==="L"?"În lume":"România"}</span><span>${e[1]}</span></li>`).join("")}</ol>`:`<p class="empty">Încă adunăm momentele acestui an.</p>`}</section>`;
 if(ys){const s=STORIES[ys[0]];h+=`<section><h2>Anul tău în poveștile Curții</h2><div class="story"><p>${ys[1]}</p><h3><a href="${s.u}" target="_blank" rel="noopener">${s.t}</a></h3><span class="meta">Citește povestea pe tonivoda.com</span></div></section>`}
 if(ds){const x=ds.items[0],s=STORIES[x[3]];
  const lead=ds.exact?`Pe ${x[0]} ${MONTHS[x[1]-1]}, ziua ta, dar în ${x[2]}, ${x[4]}.`:`Cea mai apropiată zi de a ta din poveștile Curții: pe ${x[0]} ${MONTHS[x[1]-1]} ${x[2]} ${x[4]}.`;
  h+=`<section><h2>Ziua ta în poveștile Curții</h2><div class="story"><p>${lead}</p>${ds.exact&&ds.items.length>1?ds.items.slice(1).map(z=>`<p>Tot pe ${z[0]} ${MONTHS[z[1]-1]}, în ${z[2]}, ${z[4]}.</p>`).join(""):""}<h3><a href="${s.u}" target="_blank" rel="noopener">${s.t}</a></h3></div></section>`;}
 else if(!d||!m){h+=`<section><h2>Ziua ta în poveștile Curții</h2><p class="empty">Alege și ziua și luna de mai sus ca să vezi ce s-a întâmplat în ziua ta, în poveștile de pe site.</p></section>`}
 h+=`<section><h2>Pune-l pe Facebook</h2><div class="share"><img id="card" alt="Imagine cu anul ${y}, gata de pus pe Facebook"><div class="how">
 <a class="fbbtn" id="fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(BASE+"an/"+y+"/")}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8.5V6.8c0-.8.5-1 .9-1H17V2.1L14.1 2C10.9 2 10.2 4.4 10.2 6v2.5H8V12h2.2v10H14V12h2.8l.4-3.5H14z"/></svg>Distribuie pe Facebook</a>
 <p>Se deschide fereastra Facebook cu anul ${y}. Scrii ce vrei și apeși „Postează”.</p>
 <button type="button" class="ghost" id="other">Alte aplicații</button>
 <button type="button" class="ghost" id="copy">Copiază textul</button><span class="copied" id="copied"></span>
 <p class="savehint" id="savehint" hidden>Ține degetul apăsat pe imagine, alege „Salvează imaginea”, apoi trimite-o unde vrei. Textul îl poți copia cu butonul de mai sus.</p></div></div></section>`;
 $("out").innerHTML=h;
 const shareTxt=`M-am născut în ${y}. ${ev[0]?ev[0][1]:""} Tu ce an ești? Află pe tonivoda.com, la Atelier.`;
 $("copy").onclick=()=>{const done=()=>$("copied").textContent="Textul e copiat.";
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(shareTxt).then(done).catch(()=>{$("copied").textContent=shareTxt})}else{$("copied").textContent=shareTxt}};
 drawCard(y,name,ev,dateTxt);
 $("other").addEventListener("click",async()=>{
  const link=BASE+"an/"+y+"/";
  try{
   const file=cardBlob?new File([cardBlob],`anul-meu-${y}.png`,{type:"image/png"}):null;
   if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:shareTxt+" "+link});return}
   if(navigator.share){await navigator.share({text:shareTxt,url:link});return}
  }catch(err){if(err&&err.name==="AbortError")return}
  $("savehint").hidden=false;$("card").scrollIntoView({behavior:"smooth",block:"center"});
 });
}

function wrapText(ctx,text,x,y,maxW,lh,maxLines){
 const words=text.split(" ");let line="",lines=[];
 for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
 if(line)lines.push(line);
 if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s+\S*$/,"")+"…"}
 lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length*lh;
}
async function drawCard(y,name,ev,dateTxt){
 try{await Promise.all([document.fonts.load('800 100px "Playfair Display"'),document.fonts.load('400 40px "Source Serif 4"'),document.fonts.load('600 30px "IBM Plex Sans Condensed"')])}catch(e){}
 const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 x.fillStyle="#F7F4EE";x.fillRect(0,0,W,H);
 x.fillStyle="#16120E";x.fillRect(80,96,W-160,8);x.fillRect(80,112,W-160,2);
 x.fillStyle="#A11D21";x.font='600 30px "IBM Plex Sans Condensed","Arial Narrow",sans-serif';
 x.fillText("CURTEA LUI VODĂ · ANUL TĂU",80,170);
 x.fillStyle="#3A322B";x.font='italic 400 44px "Source Serif 4",Georgia,serif';
 x.fillText(name?`${name} s-a născut în`:"M-am născut în",80,260);
 x.fillStyle="#16120E";x.font='800 300px "Playfair Display",Georgia,serif';x.fillText(String(y),66,530);
 let cy=640;x.font='400 38px "Source Serif 4",Georgia,serif';
 ev.slice(0,3).forEach(e=>{x.fillStyle="#A11D21";x.fillRect(80,cy-26,14,14);x.fillStyle="#16120E";cy+=wrapText(x,e[1],120,cy,W-200,52,3)+28});
 x.fillStyle="#D9D1C4";x.fillRect(80,H-150,W-160,2);
 x.fillStyle="#16120E";x.font='600 34px "IBM Plex Sans Condensed","Arial Narrow",sans-serif';x.fillText("Tu ce an ești?",80,H-90);
 x.fillStyle="#A11D21";x.textAlign="right";x.fillText("tonivoda.com",W-80,H-90);
 const img=$("card");if(img)img.src=c.toDataURL("image/png");
 c.toBlob(b=>{cardBlob=b},"image/png");
}
let cardBlob=null;
const BASE=new URL("./",location.href.split("?")[0].split("#")[0]).href;
$("f").addEventListener("submit",e=>{e.preventDefault();render();$("out").scrollIntoView({behavior:"smooth",block:"start"})});
const qYear=+(new URLSearchParams(location.search).get("an")||0);
if(qYear>=1940&&qYear<=2005){$("year").value=String(qYear)}else{$("year").value="1968";$("day").value="21";$("month").value="8"}
render();
</script>
